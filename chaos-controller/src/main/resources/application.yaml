spring:
  application:
    name: chaos-controller
  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      # the files in the jar all carry the same date, so the browser could not tell an old app.css from a new one:
      # no date, and the browser loads index.html, app.css and app.js anew each time
      cache:
        use-last-modified: false
        cachecontrol:
          no-cache: true

server:
  port: 8090

chaos-controller:
  docker-url: http://localhost:2375
  load-generator-url: http://localhost:8091
  grafana-url: http://localhost:3000/grafana
  # logout-url: logout page of Authelia, not set: the page shows no logout button

  services:
    - name: payment-service
      container: chaos-playground-payment
      url: http://localhost:8082
    - name: inventory-service
      container: chaos-playground-inventory
      url: http://localhost:8081

  # Authelia groups (header Remote-Groups) that get the roles, the homelab may use its own groups
  auth:
    admin-group: chaos-admin
    viewer-group: chaos-viewer

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
