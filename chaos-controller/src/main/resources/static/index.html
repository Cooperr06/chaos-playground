<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chaos Playground</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="app.css">
    <script src="app.js" defer></script>
</head>
<body>
<header class="page-header">
    <h1>Chaos Playground</h1>
    <p class="intro">
        Ein kleiner Online-Shop aus mehreren Diensten. Hier lassen sich Zahlung und Lager gezielt stören:
        Antworten verzögern, Fehler einstreuen oder den ganzen Dienst anhalten.
    </p>
</header>

<main>
    <p id="message" class="message" role="alert" hidden></p>
    <section id="services" class="services" aria-label="Dienste"></section>
</main>

<template id="service-template">
    <article class="service">
        <header class="service-header">
            <span class="lamp" aria-hidden="true"></span>
            <h2 class="service-name"></h2>
            <span class="service-state"></span>
        </header>

        <form class="chaos">
            <p class="chaos-current"></p>
            <div class="fields">
                <label>
                    Verzögerung in ms
                    <input class="latency" name="latencyMs" type="number" min="0" max="30000" step="100" value="0" required>
                </label>
                <label>
                    Fehlerquote (0 bis 1)
                    <input class="error-rate" name="errorRate" type="number" min="0" max="1" step="0.05" value="0" required>
                </label>
            </div>
            <div class="buttons">
                <button type="submit" class="primary">Chaos setzen</button>
                <button type="button" class="reset">Chaos zurücksetzen</button>
            </div>
        </form>

        <div class="buttons container-actions">
            <button type="button" data-action="stop">Stoppen</button>
            <button type="button" data-action="start">Starten</button>
            <button type="button" data-action="pause">Pausieren</button>
            <button type="button" data-action="unpause">Fortsetzen</button>
        </div>
    </article>
</template>
</body>
</html>
