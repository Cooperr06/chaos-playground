name: chaos-playground

services:
  payment-service:
    container_name: chaos-playground-payment
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "127.0.0.1:8082:8082"
    restart: unless-stopped

  inventory-service:
    container_name: chaos-playground-inventory
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

  shop-plain:
    container_name: chaos-playground-shop-plain
    build:
      context: .
      dockerfile: shop-service/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SHOP_INVENTORYURL: http://inventory-service:8081
      SHOP_PAYMENTURL: http://payment-service:8082
    depends_on:
      - inventory-service
      - payment-service
    restart: unless-stopped

  shop-resilient:
    container_name: chaos-playground-shop-resilient
    build:
      context: .
      dockerfile: shop-service/Dockerfile
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      SHOP_INVENTORYURL: http://inventory-service:8081
      SHOP_PAYMENTURL: http://payment-service:8082
      SHOP_RESILIENCEENABLED: "true"
    depends_on:
      - inventory-service
      - payment-service
    restart: unless-stopped

  load-generator:
    container_name: chaos-playground-load
    build:
      context: .
      dockerfile: load-generator/Dockerfile
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      LOADGENERATOR_TARGETURLS_0: http://shop-plain:8080
      LOADGENERATOR_TARGETURLS_1: http://shop-resilient:8080
    depends_on:
      - shop-plain
      - shop-resilient
    restart: unless-stopped
