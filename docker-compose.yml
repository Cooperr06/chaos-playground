name: chaos-playground

services:
  payment-service:
    container_name: chaos-playground-payment
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "127.0.0.1:8082:8082"
    restart: unless-stopped

  inventory-service:
    container_name: chaos-playground-inventory
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

  shop-service:
    container_name: chaos-playground-shop
    build:
      context: .
      dockerfile: shop-service/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SHOP_INVENTORYURL: http://inventory-service:8081
      SHOP_PAYMENTURL: http://payment-service:8082
    depends_on:
      - inventory-service
      - payment-service
    restart: unless-stopped
