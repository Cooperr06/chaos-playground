name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

  images:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module: [shop-service, inventory-service, payment-service, load-generator, chaos-controller]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          platforms: linux/arm64
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
          push: true
          tags: |
            ghcr.io/cooperr06/${{ matrix.module }}:latest
            ghcr.io/cooperr06/${{ matrix.module }}:${{ github.sha }}

  smoke-test:
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Builds the images from docker-compose.yml, but with the layers the images job keeps in the GitHub cache
      # (same scope per module), so Maven only downloads when a pom changes. The tags are the names docker compose
      # would give the images, so "up" below starts them without building again.
      - name: Build images
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          load: true
          set: |
            payment-service.cache-from=type=gha,scope=payment-service
            inventory-service.cache-from=type=gha,scope=inventory-service
            shop-plain.cache-from=type=gha,scope=shop-service
            shop-resilient.cache-from=type=gha,scope=shop-service
            load-generator.cache-from=type=gha,scope=load-generator
            chaos-controller.cache-from=type=gha,scope=chaos-controller
            payment-service.tags=chaos-playground-payment-service
            inventory-service.tags=chaos-playground-inventory-service
            shop-plain.tags=chaos-playground-shop-plain
            shop-resilient.tags=chaos-playground-shop-resilient
            load-generator.tags=chaos-playground-load-generator
            chaos-controller.tags=chaos-playground-chaos-controller

      - name: Start services
        run: DOCKER_GID=$(stat -c %g /var/run/docker.sock) docker compose up -d

      - name: Wait for services
        run: |
          for port in 8081 8082 8090 8091 9080 9083; do
            curl --silent --fail --retry 30 --retry-delay 2 --retry-all-errors \
              "http://localhost:$port/actuator/health"
          done
          curl --silent --fail --retry 30 --retry-delay 2 --retry-all-errors localhost:9090/-/ready
          curl --silent --fail --retry 30 --retry-delay 2 --retry-all-errors localhost:3000/grafana/api/health

      - name: Order for known product returns 201
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST localhost:8080/orders \
            --header 'Content-Type: application/json' \
            --data '{"productId":"watch-1","quantity":1,"totalAmount":99.90}')
          [ "$status" = 201 ] || { echo "expected 201, got $status"; exit 1; }

      - name: Order for unknown product returns 404
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST localhost:8080/orders \
            --header 'Content-Type: application/json' \
            --data '{"productId":"unknown","quantity":1,"totalAmount":99.90}')
          [ "$status" = 404 ] || { echo "expected 404, got $status"; exit 1; }

      - name: Order with failing payment returns 502
        run: |
          curl --silent --fail --output /dev/null \
            --request POST localhost:8082/chaos \
            --header 'Content-Type: application/json' \
            --data '{"latencyMs":0,"errorRate":1.0}'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST localhost:8080/orders \
            --header 'Content-Type: application/json' \
            --data '{"productId":"watch-1","quantity":1,"totalAmount":99.90}')
          curl --silent --fail --output /dev/null \
            --request POST localhost:8082/chaos \
            --header 'Content-Type: application/json' \
            --data '{"latencyMs":0,"errorRate":0}'
          [ "$status" = 502 ] || { echo "expected 502, got $status"; exit 1; }

      - name: Resilient order with failing payment returns 202
        run: |
          curl --silent --fail --output /dev/null \
            --request POST localhost:8082/chaos \
            --header 'Content-Type: application/json' \
            --data '{"latencyMs":0,"errorRate":1.0}'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST localhost:8083/orders \
            --header 'Content-Type: application/json' \
            --data '{"productId":"watch-1","quantity":1,"totalAmount":99.90}')
          curl --silent --fail --output /dev/null \
            --request POST localhost:8082/chaos \
            --header 'Content-Type: application/json' \
            --data '{"latencyMs":0,"errorRate":0}'
          [ "$status" = 202 ] || { echo "expected 202, got $status"; exit 1; }

      - name: Load generator places orders in both shops
        run: |
          curl --silent --fail --output /dev/null \
            --request POST localhost:8091/load \
            --header 'Content-Type: application/json' \
            --data '{"ratePerSecond":10}'
          sleep 3
          load=$(curl --silent --fail localhost:8091/load)
          curl --silent --fail --output /dev/null \
            --request POST localhost:8091/load \
            --header 'Content-Type: application/json' \
            --data '{"ratePerSecond":0}'
          echo "$load"
          targets=$(echo "$load" | grep -o '"201":[1-9][0-9]*' | wc -l)
          [ "$targets" -eq 2 ] || { echo "expected orders with 201 for both shops, got $targets"; exit 1; }

      - name: Prometheus scrapes all services
        run: |
          # the first scrape happens up to 5 seconds after Prometheus is ready
          for attempt in $(seq 1 10); do
            result=$(curl --silent --fail --get localhost:9090/api/v1/query --data-urlencode 'query=count(up == 1)')
            echo "$result"
            echo "$result" | grep -q '"value":\[[0-9.]*,"6"\]' && exit 0
            sleep 2
          done
          echo "expected 6 services up"
          exit 1

      - name: Prometheus has order metrics for both shops
        run: |
          # Prometheus scrapes every 5 seconds, the orders of the step before may not be scraped yet
          for attempt in $(seq 1 10); do
            result=$(curl --silent --fail --get localhost:9090/api/v1/query \
              --data-urlencode 'query=count(count by (target) (loadgenerator_orders_seconds_count))')
            echo "$result"
            echo "$result" | grep -q '"value":\[[0-9.]*,"2"\]' && exit 0
            sleep 2
          done
          echo "expected order metrics for 2 shops"
          exit 1

      - name: Grafana serves the dashboard anonymously
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            localhost:3000/grafana/api/dashboards/uid/chaos-playground)
          [ "$status" = 200 ] || { echo "expected 200, got $status"; exit 1; }

      - name: Grafana queries Prometheus anonymously
        run: |
          # fails with 404 "plugin not registered" if Grafana installs the Prometheus plugin in the background again
          status=$(curl --silent --output "$RUNNER_TEMP/query.json" --write-out '%{http_code}' \
            --request POST localhost:3000/grafana/api/ds/query \
            --header 'Content-Type: application/json' \
            --data '{"from":"now-5m","to":"now","queries":[{"refId":"A","datasource":{"type":"prometheus","uid":"prometheus"},"expr":"up","instant":true}]}')
          cat "$RUNNER_TEMP/query.json"
          echo
          [ "$status" = 200 ] || { echo "expected 200, got $status"; exit 1; }

      # Traefik sets Remote-User and Remote-Groups on the Pi, here the requests go to the controller directly
      - name: Prepare controller requests
        run: |
          cat > "$RUNNER_TEMP/controller.sh" <<'EOF'
          JAR="$RUNNER_TEMP/controller-cookies"

          # GET as admin, prints the body
          controller_get() {
            curl --silent --fail --show-error --header 'Remote-User: ci' --header 'Remote-Groups: chaos-admin' \
              "localhost:8090$1"
          }

          # POST as a user of the given group, prints the status; the CSRF token comes from the cookie XSRF-TOKEN
          # that a GET before sets, as app.js does it
          controller_post() {
            local group=$1 path=$2 data=${3:-} token
            curl --silent --output /dev/null --cookie-jar "$JAR" \
              --header 'Remote-User: ci' --header "Remote-Groups: $group" localhost:8090/me
            token=$(awk '$6 == "XSRF-TOKEN" {print $7}' "$JAR")
            [ -n "$token" ] || { echo "no cookie XSRF-TOKEN" >&2; return 1; }
            curl --silent --output /dev/null --write-out '%{http_code}' --request POST "localhost:8090$path" \
              --header 'Remote-User: ci' --header "Remote-Groups: $group" \
              --cookie "XSRF-TOKEN=$token" --header "X-XSRF-TOKEN: $token" \
              --header 'Content-Type: application/json' --data "$data"
          }

          expect() {
            [ "$2" = "$1" ] || { echo "expected $1, got $2"; exit 1; }
          }
          EOF

      - name: Chaos controller requires login, role and CSRF token
        run: |
          source "$RUNNER_TEMP/controller.sh"
          expect 401 "$(curl --silent --output /dev/null --write-out '%{http_code}' localhost:8090/services)"
          expect 403 "$(controller_post chaos-viewer /load '{"ratePerSecond":5}')"
          expect 403 "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST localhost:8090/load \
            --header 'Remote-User: ci' --header 'Remote-Groups: chaos-admin' \
            --header 'Content-Type: application/json' --data '{"ratePerSecond":5}')"

      - name: Chaos controller sets load
        run: |
          source "$RUNNER_TEMP/controller.sh"
          expect 200 "$(controller_post chaos-admin /load '{"ratePerSecond":5}')"
          load=$(controller_get /load)
          expect 200 "$(controller_post chaos-admin /load '{"ratePerSecond":0}')"
          echo "$load"
          expect '{"ratePerSecond":5}' "$load"

      - name: Chaos controller sets chaos in payment
        run: |
          source "$RUNNER_TEMP/controller.sh"
          expect 200 "$(controller_post chaos-admin /services/payment-service/chaos '{"latencyMs":0,"errorRate":1.0}')"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST localhost:8080/orders \
            --header 'Content-Type: application/json' \
            --data '{"productId":"watch-1","quantity":1,"totalAmount":99.90}')
          expect 200 "$(controller_post chaos-admin /services/payment-service/chaos '{"latencyMs":0,"errorRate":0}')"
          expect 502 "$status"

      - name: Chaos controller stops and starts inventory
        run: |
          source "$RUNNER_TEMP/controller.sh"
          expect 200 "$(controller_post chaos-admin /services/inventory-service/stop)"
          services=$(controller_get /services)
          echo "$services"
          echo "$services" | grep -q '"name":"inventory-service","containerState":"EXITED"' \
            || { echo "expected inventory-service to be EXITED"; exit 1; }
          expect 200 "$(controller_post chaos-admin /services/inventory-service/start)"
          curl --silent --fail --retry 30 --retry-delay 2 --retry-all-errors localhost:8081/actuator/health
          echo
          # the shop may still use connections to the stopped container, so the first orders can fail
          for attempt in $(seq 1 10); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 \
              --request POST localhost:8080/orders \
              --header 'Content-Type: application/json' \
              --data '{"productId":"watch-1","quantity":1,"totalAmount":99.90}' || true)
            echo "attempt $attempt: $status"
            [ "$status" = 201 ] && exit 0
            sleep 2
          done
          echo "expected 201 after restart, got $status"
          exit 1

      - name: Show logs
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down
