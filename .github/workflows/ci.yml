name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

  images:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module: [shop-service, inventory-service, payment-service, load-generator]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          platforms: linux/arm64
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
          push: true
          tags: |
            ghcr.io/cooperr06/${{ matrix.module }}:latest
            ghcr.io/cooperr06/${{ matrix.module }}:${{ github.sha }}

  smoke-test:
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Start services
        run: docker compose up --build -d

      - name: Wait for services
        run: |
          for port in 8080 8081 8082 8083 8091; do
            curl --silent --fail --retry 30 --retry-delay 2 --retry-all-errors \
              "http://localhost:$port/actuator/health"
          done

      - name: Order for known product returns 201
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST localhost:8080/orders \
            --header 'Content-Type: application/json' \
            --data '{"productId":"watch-1","quantity":1,"totalAmount":99.90}')
          [ "$status" = 201 ] || { echo "expected 201, got $status"; exit 1; }

      - name: Order for unknown product returns 404
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST localhost:8080/orders \
            --header 'Content-Type: application/json' \
            --data '{"productId":"unknown","quantity":1,"totalAmount":99.90}')
          [ "$status" = 404 ] || { echo "expected 404, got $status"; exit 1; }

      - name: Order with failing payment returns 502
        run: |
          curl --silent --fail --output /dev/null \
            --request POST localhost:8082/chaos \
            --header 'Content-Type: application/json' \
            --data '{"latencyMs":0,"errorRate":1.0}'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST localhost:8080/orders \
            --header 'Content-Type: application/json' \
            --data '{"productId":"watch-1","quantity":1,"totalAmount":99.90}')
          curl --silent --fail --output /dev/null \
            --request POST localhost:8082/chaos \
            --header 'Content-Type: application/json' \
            --data '{"latencyMs":0,"errorRate":0}'
          [ "$status" = 502 ] || { echo "expected 502, got $status"; exit 1; }

      - name: Resilient order with failing payment returns 202
        run: |
          curl --silent --fail --output /dev/null \
            --request POST localhost:8082/chaos \
            --header 'Content-Type: application/json' \
            --data '{"latencyMs":0,"errorRate":1.0}'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST localhost:8083/orders \
            --header 'Content-Type: application/json' \
            --data '{"productId":"watch-1","quantity":1,"totalAmount":99.90}')
          curl --silent --fail --output /dev/null \
            --request POST localhost:8082/chaos \
            --header 'Content-Type: application/json' \
            --data '{"latencyMs":0,"errorRate":0}'
          [ "$status" = 202 ] || { echo "expected 202, got $status"; exit 1; }

      - name: Load generator places orders in both shops
        run: |
          curl --silent --fail --output /dev/null \
            --request POST localhost:8091/load \
            --header 'Content-Type: application/json' \
            --data '{"ratePerSecond":10}'
          sleep 3
          load=$(curl --silent --fail localhost:8091/load)
          curl --silent --fail --output /dev/null \
            --request POST localhost:8091/load \
            --header 'Content-Type: application/json' \
            --data '{"ratePerSecond":0}'
          echo "$load"
          targets=$(echo "$load" | grep -o '"201":[1-9][0-9]*' | wc -l)
          [ "$targets" -eq 2 ] || { echo "expected orders with 201 for both shops, got $targets"; exit 1; }

      - name: Show logs
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down
