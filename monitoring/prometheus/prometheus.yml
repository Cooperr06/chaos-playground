global:
  scrape_interval: 5s
  evaluation_interval: 5s

# One job per container, the job name tells the two shops apart.
scrape_configs:
  - job_name: shop-plain
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["shop-plain:9080"]
  - job_name: shop-resilient
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["shop-resilient:9080"]
  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["inventory-service:8081"]
  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8082"]
  - job_name: load-generator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["load-generator:8091"]
  - job_name: chaos-controller
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["chaos-controller:8090"]
